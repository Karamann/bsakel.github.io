name: Garmin GPT backend smoke tests
on:
  push:
    branches: [garmin-gpt-backend-2026]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run API compatibility tests
        env:
          DATABASE_PATH: /tmp/garmin-test-ci.sqlite
          GARMIN_SHARED_TOKEN: local-test-token
        run: python -m pytest -q tests/test_garmin.py
